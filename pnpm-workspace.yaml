packages:
  - 'packages/*'
  - 'examples/*'
  - 'corpus'

# Dependencies whose install/postinstall build scripts may run
# (pnpm blocks dependency build scripts by default).
allowBuilds:
  '@swc/core': true
  canvas: true
  esbuild: true
  # next's optional image-optimization dependency; the corpus host harness
  # never touches images, so its native build stays off
  sharp: false

# The musl test lane installs on the glibc host and then runs the suite inside
# an Alpine container against the same node_modules, so the platform-specific
# binaries every bundler ships (esbuild, swc, rspack, rollup) must be present
# in BOTH flavours. Without this pnpm fetches only the host's, and the Alpine
# container finds no usable binary.
supportedArchitectures:
  libc:
    - current
    - musl

minimumReleaseAgeExclude:
  - webpack@5.109.0

# Transitive pins for advisories in the corpus host harness's tree. Next
# pulls both of these and neither is reachable from anything this repo
# publishes — but a corpus fixture must not ship known-vulnerable code into
# a CI runner either, and patched versions exist inside the same major, so
# pinning is cheaper than an allowlist entry that ages badly:
# - postcss: GHSA-6g55-p6wh-862q / GHSA-r28c-9q8g-f849 / GHSA-qx2v-qp2m-jg93
#   (next 15.5 resolves 8.4.31; the fixes land in 8.5.10/8.5.12/8.5.18)
# - sharp: GHSA-f88m-g3jw-g9cj, inherited libvips CVEs, fixed in 0.35.0
#   (next's optional image-optimization dep; the harness never renders an
#   image, and `allowBuilds` above keeps its native build off regardless)
overrides:
  postcss: '^8.5.25'
  sharp: '^0.35.3'
