name: CodeQL
# Static analysis for the JavaScript and TypeScript in this repository, which
# is not incidental here: this project rewrites module source and emits code, so
# the injection and unsafe-construction queries are pointed at exactly the kind
# of thing it does for a living.
#
# Kept out of CI.yml on purpose. CodeQL takes minutes and produces alerts rather
# than a pass/fail signal a release should hang on, so it does not belong in the
# chain `publish` waits for.
'on':
  push:
    branches:
      - main
  pull_request: null
  schedule:
    # Weekly. Queries and the advisory data behind them change even when the
    # code does not.
    - cron: '41 5 * * 1'
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # CodeQL can also analyse `rust` and `actions`. Neither is on yet: this
        # is the language the transform is written in and the one worth proving
        # out first. Adding either is a one-line change to this list.
        language:
          - javascript-typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          languages: ${{ matrix.language }}
          # index.js, index.d.ts and the wasi glue are generated by napi-rs, and
          # the presentation PDFs and docs carry no code. Alerts against files
          # nobody edits by hand are alerts nobody can act on.
          config: |
            paths-ignore:
              - docs
              - index.js
              - index.d.ts
              - browser.js
              - wasi-worker.mjs
              - wasi-worker-browser.mjs
              - wrap-esm-lambda.wasi.cjs
              - wrap-esm-lambda.wasi-browser.js
      # No build step: the JavaScript and TypeScript extractor reads sources
      # directly, and the Rust addon is not what this analysis is looking at.
      - name: Analyze
        uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          category: /language:${{ matrix.language }}
