name: CI
env:
  DEBUG: napi:*
  APP_NAME: wrap-esm-lambda
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
  # Outranks the repo's rust-toolchain.toml (which pins local machines to the
  # MSRV, see the comment there), so every cargo here keeps floating on the
  # stable the dtolnay action installs. The msrv job overrides this with the
  # floor it exists to check.
  RUSTUP_TOOLCHAIN: stable
'on':
  push:
    branches:
      - main
    tags:
      - 'v*'
    #tags-ignore:
    #  - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null
  # The ONLY route to a real npm publish: a human running the workflow and
  # typing the confirmation. Everything automatic is a dry run.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Type "publish" to release to npm. Anything else dry-runs.'
        required: false
        default: 'dry-run'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Least privilege for every job; the publish job re-grants what a release needs
# (contents: write for the GitHub Release, id-token: write for provenance).
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # A hung job never fails, so retry.yml never heals it — only a human
    # pressing cancel does. The ceiling converts a hang (one stuck pnpm
    # fetch has held a run for half an hour) into a failure the retry
    # workflow re-runs automatically. Slowest healthy job observed: ~5 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # explicit, and mandatory now that the action is pinned by SHA: this
          # action reads the toolchain out of its own ref name, and a commit
          # SHA has no name to read
          toolchain: stable
          components: clippy, rustfmt
      - name: Install dependencies
        run: pnpm install
      - name: Oxlint
        run: pnpm lint
      - name: Cargo fmt
        run: cargo fmt -- --check
      # A gate, not a report: without -D warnings this job passed with warnings
      # nobody read. The crate carries no lint-level carve-outs, so a warning
      # anywhere — a new deprecation included — fails this job.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # index.d.ts is gitignored and napi only emits it as part of a build, so
      # the typecheck below cannot resolve `../index` without one. This job
      # builds its own rather than waiting on the `build` matrix: it is the
      # fast-fail gate, and making it depend on cross-compiled targets would
      # cost minutes of first feedback.
      #
      # Debug rather than release, and placed after clippy and cargo test so it
      # reuses their target/. It is not free — clippy only *checks*, so this is
      # the first step that runs codegen: cold clippy 10 s then this 15 s, on a
      # 24-thread desktop; expect more on a shared runner. Still the cheapest
      # option on the table, since a release build is slower again and the
      # alternative is gating the fast-fail job on the whole build matrix.
      # The glue is identical either way — it is generated from napi.targets,
      # not from the profile.
      - name: Generate the JS glue (debug — the addon itself is unused here)
        run: pnpm build:debug
      # the packages are TypeScript: building them is the typecheck, and it
      # fails here before any test job pays for a broken build
      - name: Build packages
        run: pnpm build:packages
      # the specs are TypeScript too, and nothing else checks them: the runner
      # they execute under strips types without looking at them
      - name: Typecheck specs
        run: pnpm exec tsc --noEmit -p __test__/tsconfig.json
      # formatting is checked, not fixed, in CI: `pnpm format` is the local fix
      - name: Prettier
        run: pnpm exec prettier --check .
  msrv:
    name: MSRV - rustc 1.95
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # keep in step with `rust-version` in Cargo.toml and rust-toolchain.toml;
      # overrides the workflow-level `stable` so this job checks the floor
      RUSTUP_TOOLCHAIN: '1.95'
    # `rust-version = "1.95"` in Cargo.toml is a promise to contributors, and
    # until now nothing kept it: every other Rust job floats on stable, so a
    # dependency raising the real floor would surface as somebody's build
    # breaking rather than as a red check. This job is that check. It is
    # deliberately `check` and not `test` — the floor is about whether the
    # crate compiles on the version it claims, and the test suite already runs
    # on stable in the lint job.
    #
    # --locked matters: it checks the committed Cargo.lock instead of whatever
    # a fresh resolve picks today, so the answer is about this repository's
    # pinned tree rather than about crates.io's mood.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the declared floor
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # keep in step with `rust-version` in Cargo.toml
          toolchain: '1.95'
      - name: Cargo check on 1.95
        run: cargo check --all-targets --locked
  # Lives in its own file so the same definition can also run on a nightly
  # schedule — an advisory published against a dependency nobody touched needs
  # to surface without waiting for the next push. `publish` still gates on it
  # through `needs`, so a release cannot go out over a vulnerable tree.
  audit:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-audit.yml
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm build --target aarch64-unknown-linux-gnu --use-napi-cross
          # musl: Alpine-based container images, where a glibc build simply
          # will not load. Cross-compiled with zig (the conditional zig and
          # cargo-zigbuild steps below fire on this target).
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: pnpm build --target x86_64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: pnpm build --target aarch64-unknown-linux-musl -x
          # Windows and macOS build natively on their own hosts — no
          # napi-cross, no zig. All four are tested below, so `napi.targets`
          # claims only platforms this workflow actually exercises.
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build --target x86_64-pc-windows-msvc
          # Windows on arm64 — Dev Kits, Snapdragon laptops, and arm64 CI. The
          # runner is native (github's windows-11-arm, free on public repos),
          # so this is a plain native build like the x64 one above, not a
          # cross-compile.
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            build: pnpm build --target aarch64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build --target aarch64-apple-darwin
          # Intel macs are still most of the installed base, and darwin-x64 is
          # a binary this package publishes. macos-15-intel is the last x86_64
          # macOS image Actions offers (through 2027), so this lane has a shelf
          # life — when it goes, so does the ability to test the artifact.
          - host: macos-15-intel
            target: x86_64-apple-darwin
            build: pnpm build --target x86_64-apple-darwin
          - host: ubuntu-latest
            target: wasm32-wasip1-threads
            build: pnpm build --target wasm32-wasip1-threads
    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      # Zig is the linker for the musl cross-builds, and it comes from PyPI
      # rather than from a setup action. That is the path cargo-zigbuild
      # prefers — its `find_zig` looks for `python -m ziglang` before it looks
      # for a `zig` binary — and it removes the last thing in this workflow
      # carrying a deprecated Node 20 runtime. Every setup-zig action still
      # declares `using: node20`, mlugg's included, and its GitHub repository
      # is a read-only mirror of a Codeberg project, so a pinned digest there
      # is a weaker guarantee than it looks. A plain install step has no
      # runtime to deprecate and nothing to mirror.
      #
      # The venv keeps the install off the system Python (PEP 668), and the
      # shim puts a real `zig` on PATH so anything probing for the binary
      # rather than the Python module finds it too. Roughly ten seconds on a
      # cold runner; the zig cache the action used to keep is worth about five
      # seconds on top of a musl link, which does not pay for storing 38 MB.
      - name: Install zig
        if: ${{ contains(matrix.settings.target, 'musl') }}
        run: |
          python3 -m venv "$RUNNER_TEMP/zig-venv"
          "$RUNNER_TEMP/zig-venv/bin/pip" install --quiet 'ziglang==0.14.1'
          mkdir -p "$RUNNER_TEMP/zig-bin"
          printf '#!/usr/bin/env bash\nexec "%s" -m ziglang "$@"\n' \
            "$RUNNER_TEMP/zig-venv/bin/python" > "$RUNNER_TEMP/zig-bin/zig"
          chmod +x "$RUNNER_TEMP/zig-bin/zig"
          echo "$RUNNER_TEMP/zig-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-bin/zig" version
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      # --ignore-scripts for the same reason as the native test lane below:
      # the benchmark chart tooling pulls in `canvas`, which has no prebuild
      # for every host here (win-arm64 in particular) and would fall back to
      # compiling against GTK/cairo. This job only runs `napi build`, and
      # nothing it touches has an install script.
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            ${{ env.APP_NAME }}.*.node
            ${{ env.APP_NAME }}.*.wasm
          if-no-files-found: error
      # The JS loader, its types, and the wasi glue. These are gitignored, so
      # every job that resolves the package needs them from here — including
      # the ones that download no .node at all (test-js-only, azure).
      #
      # One cell produces them for everyone because the set is identical no
      # matter which target built it: napi generates the loader from
      # napi.targets in package.json, so the x64-gnu cell emits the wasi glue
      # too. x64-gnu is the designated producer for being the cheapest cell —
      # a native build, no zig and no napi-cross.
      - name: Upload the generated JS glue
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binding-glue
          path: |
            index.js
            index.d.ts
            browser.js
            wasi-worker.mjs
            wasi-worker-browser.mjs
            ${{ env.APP_NAME }}.wasi.cjs
            ${{ env.APP_NAME }}.wasi-browser.js
          if-no-files-found: error
  test-linux-binding:
    name: Test ${{ matrix.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          # arm64 was built and published but never run: Lambda's Graviton
          # runtimes are a headline target for this project, and a napi addon
          # is exactly the kind of thing that can be arch-specific. The
          # aarch64 runner is native, so no QEMU is involved.
          - aarch64-unknown-linux-gnu
          # musl is a different libc, not a different arch: same amd64 runner,
          # an Alpine image (the docker params step picks it from the target
          # name), and the addon's own musl detection deciding which binary to
          # load.
          - x86_64-unknown-linux-musl
          # and the combination: arm64 Alpine. The runner is native arm64 and
          # the image comes from the target name, so this needs no new
          # machinery — only the artifact.
          - aarch64-unknown-linux-musl
        node:
          - '22'
          - '24'
          - '26'
    runs-on: ${{ contains(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Output docker params
        id: docker
        run: |
          node -e "
            if ('${{ matrix.target }}'.startsWith('aarch64')) {
              console.log('PLATFORM=linux/arm64')
            } else {
              console.log('PLATFORM=linux/amd64')
            }
          " >> $GITHUB_OUTPUT
          node -e "
            if ('${{ matrix.target }}'.endsWith('-musl')) {
              console.log('IMAGE=node:${{ matrix.node }}-alpine')
            } else {
              console.log('IMAGE=node:${{ matrix.node }}-slim')
            }
          " >> $GITHUB_OUTPUT
      # An explicit, retried pull: `docker run` would pull implicitly, but
      # without retries — one registry TLS timeout (a real occurrence) fails
      # the lane before the suite starts.
      - name: Pull the test image
        run: .github/scripts/pull-image.sh "${{ steps.docker.outputs.IMAGE }}" "${{ steps.docker.outputs.PLATFORM }}"
      # Each ARCH installs on its own runner (aarch64 included), so pnpm
      # fetches those platform-specific optional deps natively. LIBC is the
      # exception: the musl lane installs on this glibc host and runs the suite
      # inside Alpine, which is why pnpm-workspace.yaml asks for both libc
      # flavours. Any future arch tested without installing on it — an
      # emulated one, say — would need that same treatment.
      - name: Install dependencies
        run: pnpm install
      # on the host, where pnpm exists: the container runs plain node against
      # the volume-mounted workspace, so the packages' dist/ must already be
      # there
      - name: Build packages
        run: pnpm build:packages
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-${{ matrix.target }}
          path: .
      # gitignored, so a checkout does not have them — the .node above is
      # unreachable without the loader that resolves it
      - name: Download the generated JS glue
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binding-glue
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      # Plain `docker run`, replacing the unmaintained addnab/docker-run-action
      # (a node12-era action the runner had to force onto newer Node) — the
      # same pattern the Lambda lane uses. `-eu` matters: without it a failing
      # oxc run would be masked by a passing acorn run, since a POSIX sh
      # script's exit code is its last command's.
      #
      # node:25+ images bundle no package manager (yarn/corepack removed);
      # the suite runs on node's own test runner, so plain node suffices.
      # WRAP_ESM_LAMBDA_ENGINE=oxc is EXPLICIT on purpose: core falls back
      # to the pure-JS engine when the addon cannot be loaded, and an
      # implicit run would turn a broken or missing native artifact into a
      # green acorn run. Naming the engine makes the native lane fail.
      # Second run: the whole suite again on the pure-JS acorn engine, so
      # the JS-only mode stays as covered as the native one.
      - name: Test bindings
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            --platform ${{ steps.docker.outputs.PLATFORM }} \
            "${{ steps.docker.outputs.IMAGE }}" sh -eu -c '
              WRAP_ESM_LAMBDA_ENGINE=oxc OXC_TSCONFIG_PATH=./__test__/tsconfig.json node --import @oxc-node/core/register --test "__test__/*.spec.ts"
              WRAP_ESM_LAMBDA_ENGINE=acorn OXC_TSCONFIG_PATH=./__test__/tsconfig.json node --import @oxc-node/core/register --test "__test__/*.spec.ts"
            '
  test-lambda-runtime:
    name: Test lambda/nodejs:${{ matrix.runtime }} - ${{ matrix.target }}
    needs:
      - build
    # contents stays read; pull-requests: write is for the sticky
    # cold-start-chart comment one matrix cell posts on same-repo PRs
    permissions:
      contents: read
      pull-requests: write
    # The lanes above run node:N-slim and node:N-alpine — reasonable proxies.
    # This one is not a proxy: it is the image an actual Lambda function runs
    # on. Amazon Linux 2023, AWS's own Node build, and a managed minor that
    # moves on AWS's cadence rather than nodejs.org's — docs/serverless.md
    # makes the point that the embedded minor is unpublished and therefore
    # unknowable, which is precisely why the platform's own image is worth
    # testing against instead of assuming node:22-slim stands in for it.
    #
    # Both architectures Lambda sells (x86_64 and Graviton) and both runtimes
    # it currently offers. Note what is absent: node 26. There is no
    # nodejs26.x runtime, so this matrix tracks the platform rather than the
    # Node release line — when AWS adds one, a row is added here.
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        runtime:
          - '22'
          - '24'
    runs-on: ${{ contains(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6
      # The host node installs and compiles the workspace, nothing more: the
      # image ships npm but no pnpm, so the arrangement is the musl lane's —
      # install here, mount the workspace, run every test on the image's node.
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm build:packages
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-${{ matrix.target }}
          path: .
      # gitignored — see the binding lane above
      - name: Download the generated JS glue
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binding-glue
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      # AWS rebuilds these images on its own cadence and does not publish the
      # Node minor inside them, so a run like this one is the only place the
      # answer is observable. On the job summary it stays readable; buried in
      # the suite's TAP output it is two thousand lines deep. The digest goes
      # with it, because "node 22.23.1" is only reproducible if you can say
      # which image it came out of.
      - name: Record the runtime image's Node version
        run: |
          set -euo pipefail
          image="public.ecr.aws/lambda/nodejs:${{ matrix.runtime }}"
          platform=${{ contains(matrix.target, 'aarch64') && 'linux/arm64' || 'linux/amd64' }}
          .github/scripts/pull-image.sh "$image" "$platform" >/dev/null
          version=$(docker run --rm --entrypoint /bin/sh --platform "$platform" "$image" -c 'node --version')
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          {
            echo "### Lambda runtime image"
            echo
            echo "| image | platform | node | digest |"
            echo "| ----- | -------- | ---- | ------ |"
            echo "| \`$image\` | \`$platform\` | \`$version\` | \`${digest#*@}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          # the digest too, not just the version: the summary is not readable
          # from the API, so without this line a green run proves only that
          # `docker image inspect` exited zero, not what it actually returned
          echo "$image ($platform) runs $version at ${digest#*@}"
      # A plain `docker run` rather than the action the lanes above use, for
      # one reason: the entrypoint. The base image boots the runtime interface
      # client and blocks waiting for an invocation, so for the suite it has
      # to be replaced with a shell. --platform is explicit so a lane that
      # ever landed on the wrong runner fails loudly instead of quietly
      # passing under emulation.
      - name: Test bindings on the Lambda base image
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            --platform ${{ contains(matrix.target, 'aarch64') && 'linux/arm64' || 'linux/amd64' }} \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e OXC_TSCONFIG_PATH=./__test__/tsconfig.json \
            -e WRAP_ESM_LAMBDA_CONFIG="$GITHUB_WORKSPACE/__test__/fixtures/patch/wrap.config.mjs" \
            "public.ecr.aws/lambda/nodejs:${{ matrix.runtime }}" -eu -c '
              node --version
              # the suite, both engines, engine named explicitly for the same
              # reason as every other lane: an implicit run turns a native
              # artifact that will not load into a green acorn run
              WRAP_ESM_LAMBDA_ENGINE=oxc node --import @oxc-node/core/register --test "__test__/*.spec.ts"
              WRAP_ESM_LAMBDA_ENGINE=acorn node --import @oxc-node/core/register --test "__test__/*.spec.ts"
              # The delivery shape, cheap and deterministic: hook via
              # NODE_OPTIONS, handler loaded late by an ESM main. This is the
              # same stand-in the 11-version interplay matrix runs, so a
              # failure here versus in the real-RIC step below tells you
              # whether the shape broke or the platform plumbing did.
              for app in app.mjs app.cjs; do
                out=$(WRAP_ESM_LAMBDA_ENGINE=oxc \
                  NODE_OPTIONS="--import @wrap-esm-lambda/hooks/register" \
                  node hooks/interplay-matrix/fixtures/bootstrap-sim.mjs "__test__/fixtures/patch/$app")
                if [ "$out" != "patched:sent:hello" ]; then
                  echo "NODE_OPTIONS delivery failed for $app: expected patched:sent:hello, got: $out"
                  exit 1
                fi
                echo "NODE_OPTIONS delivery via ESM bootstrap: $app -> $out"
              done
            '
      # And then the thing no stand-in can be: AWS's own runtime interface
      # client, booted by the image's own entrypoint, loading the handler by
      # its own rules, answering a real invocation. The base images ship the
      # runtime interface emulator for exactly this, so the entrypoint is
      # left alone here and the container is driven over HTTP instead.
      #
      # LAMBDA_TASK_ROOT is pointed at the patch fixture so the RIC resolves
      # `lambda-handler.handler` there; the working directory follows it so
      # the bare specifier in NODE_OPTIONS resolves up into the workspace's
      # node_modules. The engine is named for the usual reason — this must
      # fail on a binding that will not load, not degrade to acorn.
      - name: Invoke a handler through the real runtime interface client
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/__test__/fixtures/patch"
          docker run -d --name ric-lane \
            --platform ${{ contains(matrix.target, 'aarch64') && 'linux/arm64' || 'linux/amd64' }} \
            -p 9000:8080 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$fixture" \
            -e LAMBDA_TASK_ROOT="$fixture" \
            -e NODE_OPTIONS="--import @wrap-esm-lambda/hooks/register" \
            -e WRAP_ESM_LAMBDA_CONFIG="$fixture/wrap.config.mjs" \
            -e WRAP_ESM_LAMBDA_ENGINE=oxc \
            "public.ecr.aws/lambda/nodejs:${{ matrix.runtime }}" lambda-handler.handler

          body=''
          for _ in $(seq 1 30); do
            body=$(curl -s --max-time 20 -XPOST \
              'http://localhost:9000/2015-03-31/functions/function/invocations' -d '{}' || true)
            if [ -n "$body" ]; then break; fi
            sleep 1
          done

          ok=0
          case "$body" in *patched:sent:hello*) ok=1 ;; esac
          if [ "$ok" -ne 1 ]; then
            echo "expected the RIC to return patched:sent:hello, got: ${body:-<no response>}"
            echo '--- container logs ---'
            docker logs ric-lane || true
          else
            echo "real RIC invocation returned: $body"
          fi
          docker rm -f ric-lane >/dev/null || true
          [ "$ok" -eq 1 ]
      # The same real-RIC exercise once more, with nothing about the handler
      # written down anywhere: the config derives the handler's file and
      # export name from _HANDLER/LAMBDA_TASK_ROOT at preload (the aws-lambda
      # preset), exactly the way the RIC itself locates it. Both module
      # systems, because the tap shapes differ — the ESM `export const
      # handler` takes the rewrite path, the CJS handler is a
      # `module.exports` property tap. This is the generic-tap replacement
      # for the original wrap-entry Lambda story, proven on the platform's
      # own runtime image.
      - name: Invoke through the real RIC with the _HANDLER-derived generic config
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/__test__/fixtures/lambda-generic"
          invoke() {
            handler="$1"
            port="$2"
            docker run -d --name ric-generic \
              --platform ${{ contains(matrix.target, 'aarch64') && 'linux/arm64' || 'linux/amd64' }} \
              -p "$port:8080" \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
              -w "$fixture" \
              -e LAMBDA_TASK_ROOT="$fixture" \
              -e NODE_OPTIONS="--import @wrap-esm-lambda/hooks/register" \
              -e WRAP_ESM_LAMBDA_CONFIG="$fixture/wrap.config.mjs" \
              -e WRAP_ESM_LAMBDA_ENGINE=oxc \
              -e WRAP_ESM_LAMBDA_DEBUG=1 \
              "public.ecr.aws/lambda/nodejs:${{ matrix.runtime }}" "$handler"

            body=''
            for _ in $(seq 1 30); do
              body=$(curl -s --max-time 20 -XPOST \
                "http://localhost:$port/2015-03-31/functions/function/invocations" -d '{"who":"ric"}' || true)
              if [ -n "$body" ]; then break; fi
              sleep 1
            done

            ok=0
            case "$body" in *wrapped:hi:ric*) ok=1 ;; esac
            if [ "$ok" -ne 1 ]; then
              echo "expected the RIC to return wrapped:hi:ric for $handler, got: ${body:-<no response>}"
              echo '--- container logs ---'
              docker logs ric-generic || true
            else
              echo "real RIC invocation for $handler returned: $body"
            fi
            docker rm -f ric-generic >/dev/null || true
            [ "$ok" -eq 1 ]
          }
          invoke handler.handler 9101
          invoke handler-cjs/handler.handler 9102
      # The practical composition, on the platform's own image: a Hono app
      # behind hono/aws-lambda's handle(), instrumented from one config with
      # zero app changes — the handler discovered from _HANDLER (wall time
      # and RSS from inside the process), hono's matched route template, and
      # every AWS SDK operation intercepted at @smithy/core's Client#send
      # before credentials or network exist (which is why no LocalStack).
      # The script answers the example's two API Gateway events and its SQS
      # batch (consumer.handler in a second container — SQS in, SNS publish
      # out, same config) through the emulator, then measures each
      # delivery's cost WITHIN its own artifact — no-instrumentation vs
      # runtime hook on the unbundled app, plain bundle vs patches baked on
      # the bundled one — because the deliveries are not substitutes:
      # bundling erases the module boundaries the runtime hook's package
      # entries match. It requires every layer to have spoken in the logs
      # (and the uninstrumented controls to have stayed silent), and puts
      # three views of the same invocations on the job summary: the REPORT
      # line (real duration and billed milliseconds; its Max Memory Used
      # echoes the configured size — the emulator meters time, not memory),
      # the container's cgroup peak (the genuine max-memory number a real
      # Lambda would have reported), and the patch's in-process wall time
      # and RSS.
      - name: Invoke the Hono example through the real RIC, and read the bill
        id: rie
        env:
          # for the summary's reference-chart embed: the PR's head commit
          # (github.sha on pull_request events is the ephemeral merge
          # commit), or the pushed commit itself on push events
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          .github/scripts/hono-lambda-rie.sh \
            "public.ecr.aws/lambda/nodejs:${{ matrix.runtime }}" \
            ${{ contains(matrix.target, 'aarch64') && 'linux/arm64' || 'linux/amd64' }} \
            "$GITHUB_STEP_SUMMARY"
      # The same contrast, visible where the conversation happens: a sticky
      # PR comment charting THIS run's billed cold starts (mermaid renders
      # in comments — no image hosting involved) with the committed
      # reference chart under it. One matrix cell posts it, PATCHing the
      # same comment on every push instead of piling up. Same-repo PRs
      # only: a fork's token cannot write comments.
      - name: Chart the delivery contrast on the PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          matrix.runtime == '22' && !contains(matrix.target, 'aarch64')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # the head commit, NOT github.sha: on pull_request events that is
          # the ephemeral merge commit, whose raw URLs rot after the merge
          # ref is recomputed or collected
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASELINE_COLD: ${{ steps.rie.outputs.baseline_cold }}
          HOOK_COLD: ${{ steps.rie.outputs.hook_cold }}
          PLAIN_COLD: ${{ steps.rie.outputs.plain_cold }}
          BUILT_COLD: ${{ steps.rie.outputs.built_cold }}
          IMAGE: public.ecr.aws/lambda/nodejs:${{ matrix.runtime }}
          PLATFORM: linux/amd64
        run: .github/scripts/pr-cold-start-comment.sh
  test-native-platform:
    name: Test ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    # Windows and macOS, on the runner itself rather than in a container.
    # Neither had ever run the suite, and both exercise code the Linux lanes
    # cannot: the acorn engine reimplements module resolution over
    # node:path (drive letters, backslashes, junction-linked pnpm stores),
    # matching compares '/'-normalized suffixes, and every spec that shells
    # out spawns a real child process. The acorn run matters most here for
    # exactly that reason, so both engines run on every platform.
    #
    # Both arches of both OSes: a napi addon is exactly the kind of thing that
    # can be arch-specific, and building an artifact is not evidence that it
    # loads. Every runner here is native — no emulation anywhere in this job.
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
        node:
          - '22'
          - '24'
          - '26'
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # --ignore-scripts: the benchmark chart tooling pulls in `canvas`, which
      # has no prebuild for every Node/platform pair here and would fall back
      # to compiling against GTK/cairo — a dependency of chart generation, not
      # of the suite, failing the install before a single test runs. Nothing
      # the tests need has an install script: the bundler binaries (esbuild,
      # swc, rspack) all arrive as platform-specific optional packages, which
      # is verified by running this whole suite off such an install.
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Build packages
        run: pnpm build:packages
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      # gitignored — see the binding lane above. Runs on macOS and Windows too;
      # the artifact is plain text files, so there is nothing host-specific.
      - name: Download the generated JS glue
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binding-glue
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      # env: rather than an inline assignment — the default shell here is pwsh
      # on Windows, where `VAR=value cmd` is not a thing
      - name: Test bindings (native engine)
        run: node --import @oxc-node/core/register --test "__test__/*.spec.ts"
        env:
          WRAP_ESM_LAMBDA_ENGINE: oxc
          OXC_TSCONFIG_PATH: ./__test__/tsconfig.json
      - name: Test bindings (acorn engine)
        run: node --import @oxc-node/core/register --test "__test__/*.spec.ts"
        env:
          WRAP_ESM_LAMBDA_ENGINE: acorn
          OXC_TSCONFIG_PATH: ./__test__/tsconfig.json
  test-wasi:
    name: Test WASI target - node@${{ matrix.node }}
    needs:
      - build
    # The WASI build is the reach onto every platform with no prebuilt addon,
    # so it carries the same Node matrix as the native lane rather than being
    # spot-checked on one version: its runtime (@napi-rs/wasm-runtime, wasi
    # threads) is exactly the layer Node keeps moving under us.
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22'
          - '24'
          - '26'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The wasi runtime (@napi-rs/wasm-runtime) is a regular devDependency,
      # so a plain install suffices — no per-arch config needed.
      - name: Install dependencies
        run: pnpm install
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: .
      # gitignored, and this lane needs more of the set than the others: the
      # assertion below resolves wrap-esm-lambda.wasi.cjs by name, not just
      # index.js. Both come from the same artifact.
      - name: Download the generated JS glue
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binding-glue
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      # This lane used to pass NAPI_RS_FORCE_WASI=1 and cannot any more, for two
      # independent reasons that only became visible together.
      #
      # The flag is a tri-state in the loader @napi-rs/cli now generates: only
      # 'true' and 'error' select WASI, and every other value — '1' included —
      # leaves native preferred. So '1' stopped meaning what it said.
      #
      # And 'error', the value that does say it, cannot be used either, because
      # the variable is read by *every* napi-rs binding in the process, not just
      # this package's. rolldown and rspack are napi-rs packages and the suite
      # runs them; ordering them to require a WASI binding they do not ship
      # fails them outright. The old '1' was quietly correct on both counts at
      # once — forcing WASI here under the truthy loader of the day, while
      # reading as "not forced" to the newer loaders those bundlers ship.
      #
      # Nothing needs to be forced. This job downloads only the wasm artifact,
      # so there is no native binding to prefer and the loader reaches WASI on
      # its own. What the flag was really buying was the guarantee that a lane
      # named "Test WASI target" is testing WASI, and that is worth keeping — so
      # it is asserted directly, against the module registry, instead of being
      # implied by an environment variable that means different things to
      # different packages.
      - name: Prove the WASI binding is the one under test
        run: |
          node -e "
            require('./index.js')
            if (!(require.resolve('./wrap-esm-lambda.wasi.cjs') in require.cache)) {
              console.error('index.js did not load the wasi binding — this lane is testing something else')
              process.exit(1)
            }
            console.log('wasi binding confirmed')
          "
      - name: Test bindings
        run: pnpm test
        env:
          # explicit, like the native lane: a wasi binding that fails to load
          # must fail this job, not quietly become an acorn run
          WRAP_ESM_LAMBDA_ENGINE: oxc
  test-js-only:
    name: Test JS-only fallback - node@${{ matrix.node }}
    # No .node and no Rust: the shape a consumer gets on a platform with no
    # prebuilt addon (and the one npm's optional-dependency bug produces).
    # Core degrades to the acorn engine with a warning instead of throwing out
    # of `--import`, and this proves the degraded mode end to end on every
    # supported major — not just in a unit test.
    #
    # It does take the glue artifact, and the distinction is the whole point of
    # the lane. "Loader present, no binding for this platform" is the consumer
    # shape being tested; "no loader at all" is a different failure that
    # reports as `Cannot find module .../index.js — verify package.json has a
    # valid main entry`. Without this download the specs would still pass, on
    # the wrong path.
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22'
          - '24'
          - '26'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm build:packages
      # the loader only — no bindings-* download, so no .node lands next to it
      - name: Download the generated JS glue
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binding-glue
          path: .
      - name: Test with no native binding present
        # The excluded specs are the ones that reach for the addon directly
        # (`../index`) or pin WRAP_ESM_LAMBDA_ENGINE=oxc in a child process —
        # both are native-by-construction and covered by test-linux-binding.
        run: |
          SPECS=$(ls __test__/*.spec.ts | grep -vE 'index\.spec|orchestrion-compare|patch\.spec|engine-parity|bundlers|comment-preservation')
          echo "$SPECS"
          OXC_TSCONFIG_PATH=./__test__/tsconfig.json node --import @oxc-node/core/register --test $SPECS
        shell: bash
  test-azure-functions:
    name: Test Azure Functions (Core Tools) - node@${{ matrix.node }}
    # Core Tools' `func start` is the platform's own emulation: the real host
    # process spawning the real Node worker, so the hook pipeline the
    # azure-functions preset brackets is the production one, not a replica
    # (the replica lives in azure-functions.spec.ts and runs on every lane).
    # No artifact download and no Rust: the preset emits no patch entries, so
    # the runtime shell never binds the transform engine — this lane proves
    # the bracket, not the tap. The driver runs both delivery shapes: the
    # languageWorkers__node__arguments preload and the package.json "main"
    # prelude.
    #
    # Deliberately NOT taking the binding-glue artifact either, unlike
    # test-js-only. Nothing here resolves the addon, so the glue would buy only
    # a `needs: build` edge that makes this lane wait on cross-compiled targets
    # it never loads. If a future preset does emit patch entries, this lane
    # needs the glue and the dependency that comes with it.
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22'
          - '24'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm build:packages
      # Not a workspace dependency on purpose: its postinstall downloads the
      # host binaries from cdn.functions.azure.com, and a restricted network
      # must not lose `pnpm install` over an example's tooling. Pinned exactly
      # because a global npm install is the one dependency the lockfile cannot
      # cover — bump it here, deliberately, the way Renovate bumps the rest.
      - name: Install Azure Functions Core Tools
        run: npm i -g azure-functions-core-tools@4.12.1
      - name: Record versions
        run: |
          echo "### Azure Functions Core Tools" >> $GITHUB_STEP_SUMMARY
          echo "\`func --version\`: $(func --version)" >> $GITHUB_STEP_SUMMARY
          echo "\`node --version\`: $(node --version)" >> $GITHUB_STEP_SUMMARY
      - name: Drive func start through both delivery shapes
        run: pnpm --filter example-azure-functions check
  benchmark:
    name: Benchmark
    # Not in publish's `needs`: a release should not hinge on an apt install
    # of hyperfine succeeding, and numbers from whichever shared runner picked
    # up the job were never worth gating on. Two modes:
    # - a push to main runs the harness once and posts the tables — the
    #   longitudinal signal;
    # - a pull request builds BASE and HEAD side by side on the same runner
    #   and interleaves them in one hyperfine invocation, so "does this PR
    #   improve things" has an answer that cross-run noise cannot fake.
    #   Cross-runner comparisons are meaningless on shared runners; same-run
    #   A/B is the only honest one.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout base (PR A/B)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Install hyperfine
        # Acquire::Retries: an apt mirror hiccup should cost seconds, not the job
        run: sudo apt -o Acquire::Retries=3 update && sudo apt -o Acquire::Retries=3 install -y hyperfine
      - name: Build head
        run: pnpm install && pnpm build && pnpm build:packages
      - name: Build base (PR A/B)
        if: github.event_name == 'pull_request'
        working-directory: base
        # Base carries its own `packageManager` pin, and this is the only job
        # that installs two trees side by side on one runner. A PR that moves
        # the pin therefore has to install base at the OLD one, which fails
        # outright when pnpm has since marked that release broken — the pnpm
        # on PATH refuses it and the benchmark dies for a reason that has
        # nothing to do with the numbers. Dropping the field is not a
        # workaround but the more correct A/B: the comparison is of base's
        # code against head's, so holding the package manager constant across
        # both trees removes a variable instead of introducing one. Written
        # with node rather than `pnpm pkg delete` because that is itself a
        # pnpm invocation inside base, and would hit the same refusal.
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.packageManager;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          pnpm install && pnpm build && pnpm build:packages
      - name: Benchmark (main)
        if: github.event_name == 'push'
        run: |
          cd hooks && ./bench_hooks.sh && cd ..
          cat hooks/benchTable.md >> $GITHUB_STEP_SUMMARY
          # The transform-latency table too, so every case in
          # benchmark/tap-cases.ts (tap tiers, plumbing, the privates-bridge
          # rewrite pair) leaves a per-commit trail on main, not only the
          # A/B numbers a PR run produces.
          {
            echo ''
            echo '## Transform latency'
            echo '```'
            pnpm --silent bench
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Benchmark base vs head (PR)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Cold start, base and head interleaved in ONE hyperfine run. The
          # command set mirrors hooks/bench_hooks.sh; if the base commit
          # predates this harness, fall back to a head-only run.
          if [ -f base/hooks/register-tap-oxc.mjs ]; then
            hyperfine --warmup 5 --export-markdown coldCompare.md \
              -n 'base: baseline' 'cd base/hooks && node runtime.mjs' \
              -n 'head: baseline' 'cd hooks && node runtime.mjs' \
              -n 'base: noop hook' 'cd base/hooks && node --import ./sync-hooks-noop.mjs runtime.mjs' \
              -n 'head: noop hook' 'cd hooks && node --import ./sync-hooks-noop.mjs runtime.mjs' \
              -n 'base: tap oxc' 'cd base/hooks && node --import ./register-tap-oxc.mjs runtime.mjs' \
              -n 'head: tap oxc' 'cd hooks && node --import ./register-tap-oxc.mjs runtime.mjs' \
              -n 'base: tap acorn' 'cd base/hooks && node --import ./register-tap-acorn.mjs runtime.mjs' \
              -n 'head: tap acorn' 'cd hooks && node --import ./register-tap-acorn.mjs runtime.mjs'
          else
            echo '_base commit predates the cold-start harness — head only:_' > coldCompare.md
            hyperfine --warmup 5 --export-markdown /dev/stdout \
              -n 'head: baseline' 'cd hooks && node runtime.mjs' \
              -n 'head: tap oxc' 'cd hooks && node --import ./register-tap-oxc.mjs runtime.mjs' \
              -n 'head: tap acorn' 'cd hooks && node --import ./register-tap-acorn.mjs runtime.mjs' >> coldCompare.md
          fi
          {
            echo '## Cold start — base vs head (same runner, interleaved)'
            cat coldCompare.md
          } >> "$GITHUB_STEP_SUMMARY"
          # Transform latency + in-process cold-start medians, per tree.
          {
            echo ''
            echo '## Transform latency — head'
            echo '```'
            pnpm --silent bench
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f base/benchmark/bench.ts ]; then
            {
              echo ''
              echo '## Transform latency — base'
              echo '```'
              cd base && pnpm --silent bench && cd ..
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pull requests must never reach this job. Until now it was reached on
    # every PR and only ever skipped because one of its `needs` had failed —
    # so the first fully green PR ran it, and the one thing standing between a
    # pull request and `npm publish` was a commit subject that happens not to
    # start with a version number. `git log -1 --pretty=%s` on a PR reads the
    # branch's own head commit, so "0.2.0 add feature" would have been enough.
    #
    # A push dry-runs the release; a manual dispatch is the only thing that can
    # arm it (see the Publish step).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write
    needs:
      - lint
      - msrv
      - audit
      - test-linux-binding
      - test-lambda-runtime
      - test-native-platform
      - test-wasi
      - test-js-only
      - test-azure-functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: create npm dirs
        run: pnpm exec napi create-npm-dirs
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      # index.js and index.d.ts are this package's `main` and its types — both
      # named in package.json "files" — and this job does not build, so without
      # this step the tarball would go up without an entry point.
      #
      # A second copy lands under artifacts/binding-glue/ from the step above;
      # `napi artifacts` only looks for .node/.wasm, so it ignores it. This
      # download is what puts them at the repo root where "files" resolves.
      #
      # Building here instead was the alternative and is worse: it would ship a
      # loader that no test lane ever exercised. This way the exact bytes the
      # test jobs ran against are the bytes that get published.
      - name: Download the generated JS glue
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binding-glue
          path: .
      - name: Move artifacts
        run: pnpm run artifacts
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Pack the workspace packages
        # `pnpm publish -r --dry-run` resolves the workspace: protocol, runs each
        # prepack, and reports exactly what would go up — without contacting the
        # registry. The tarball contents themselves are asserted by
        # __test__/tarballs.spec.ts, which every test lane runs.
        # --filter './packages/*': `-r` alone includes the workspace ROOT, and
        # the root is the addon, which publishes through `npm publish` +
        # `napi prepublish` below. Without the filter the addon would be
        # attempted twice and the second attempt would fail on an existing
        # version.
        run: pnpm publish -r --dry-run --no-git-checks --filter './packages/*'
      - name: Prepublish the addon (dry run)
        # Heads up: this MUTATES package.json even under --dry-run — it injects
        # the per-platform packages as optionalDependencies, which is what a
        # real publish needs and what must never be committed. Harmless in this
        # throwaway checkout; do not add a `pnpm install` after it, and if you
        # run it locally, discard the change.
        run: pnpm exec napi prepublish -t npm --dry-run
      - name: Publish preview (pkg.pr.new)
        # Installable previews for every green push, without touching npmjs.
        # This step sits here, after the prepublish dry-run, on purpose:
        # everything a preview needs is already assembled at this point — the
        # tested .node binaries under npm/, the glue the test lanes ran
        # against, and the per-platform optionalDependencies the dry-run just
        # injected into package.json. pkg.pr.new rewrites every sibling
        # reference (the workspace:^ links between the packages AND those
        # injected platform pins) to its own commit-keyed tarball URLs, so a
        # consumer machine installs the full dependency chain from the printed
        # URLs with no registry and no token.
        #
        # Prerequisite: the pkg.pr.new GitHub App must be installed on this
        # repository (https://github.com/apps/pkg-pr-new) — without it the
        # upload is rejected and this step fails.
        run: pnpm exec pkg-pr-new publish '.' './npm/*' './packages/*'
      - name: Publish
        # Two things must both be true to reach npm: a human dispatched this
        # workflow, and they typed the confirmation. A tag or a version-shaped
        # commit subject is NOT enough — this repository is not publishing yet,
        # and the pipeline being correct must not mean the pipeline being armed.
        #
        # The token lives on THIS step. It used to sit on the Release step
        # below, which meant `npm publish` wrote an empty _authToken and the
        # whole path was untested.
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'publish'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm config set provenance true
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
          # the workspace packages first, in dependency order (pnpm handles
          # that): core depends on engine-acorn, and publishing it first would
          # leave a window where the dependency does not resolve
          pnpm publish -r --access public --no-git-checks --filter './packages/*'
          # then the addon, through the napi flow its prepublishOnly runs
          npm publish --access public
      - name: Publish skipped
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'publish'
        run: |
          echo "Dry run only. To release: run this workflow manually with publish=publish." >> $GITHUB_STEP_SUMMARY
      - name: Assemble release body
        if: github.ref_type == 'tag'
        # The overview page a release deserves, assembled from what the repo
        # already maintains: the per-release notes (docs/releases/<tag>.md,
        # written when the version is bumped), then the committed cold-start
        # table. GitHub's auto-generated notes (the merged-PR list) are
        # appended by the release action itself.
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cat "$notes" > release-body.md
          else
            echo "_No release notes file at $notes — see CHANGELOG.md._" > release-body.md
          fi
          {
            echo ''
            echo '## Cold start (hyperfine, committed table)'
            echo ''
            cat hooks/benchTable.md
          } >> release-body.md
          # The charts, VISIBLE on the release page rather than only linked
          # as assets: embedded via raw URLs pinned to this tag, so every
          # release shows the charts as of its own commit — including the
          # release notes that forget to embed them by hand.
          {
            echo ''
            echo '## Charts'
            echo ''
            for chart in \
              hooks/tapMechanismChart.svg \
              hooks/tapEngineChart.svg \
              hooks/benchChart.svg \
              examples/hono-lambda/coldStartChart.svg; do
              [ -f "$chart" ] || continue
              echo "![${chart}](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/${chart})"
              echo ''
            done
          } >> release-body.md
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: release-body.md
          generate_release_notes: true
          files: |
            ${{ env.APP_NAME }}.*.node
            ${{ env.APP_NAME }}.*.wasm
            hooks/benchChart.svg
            hooks/tapMechanismChart.svg
            hooks/tapEngineChart.svg
            examples/hono-lambda/coldStartChart.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
