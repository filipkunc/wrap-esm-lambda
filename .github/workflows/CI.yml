name: CI
env:
  DEBUG: napi:*
  APP_NAME: wrap-esm-lambda
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
'on':
  push:
    branches:
      - main
    tags:
      - 'v*'
    #tags-ignore:
    #  - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install dependencies
        run: pnpm install
      - name: Oxlint
        run: pnpm lint
      # the packages are TypeScript: building them is the typecheck, and it
      # fails here before any test job pays for a broken build
      - name: Build packages
        run: pnpm build:packages
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy
      - name: Test
        run: cargo test
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm build --target aarch64-unknown-linux-gnu --use-napi-cross
          # Windows and macOS build natively on their own hosts — no
          # napi-cross, no zig. Both are tested below, so `napi.targets`
          # claims only platforms this workflow actually exercises.
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build --target x86_64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: wasm32-wasip1-threads
            build: pnpm build --target wasm32-wasip1-threads
    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - uses: goto-bus-stop/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            ${{ env.APP_NAME }}.*.node
            ${{ env.APP_NAME }}.*.wasm
          if-no-files-found: error
  test-linux-binding:
    name: Test ${{ matrix.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          # arm64 was built and published but never run: Lambda's Graviton
          # runtimes are a headline target for this project, and a napi addon
          # is exactly the kind of thing that can be arch-specific. The
          # aarch64 runner is native, so no QEMU is involved.
          - aarch64-unknown-linux-gnu
        node:
          - '22'
          - '24'
          - '26'
    runs-on: ${{ contains(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Output docker params
        id: docker
        run: |
          node -e "
            if ('${{ matrix.target }}'.startsWith('aarch64')) {
              console.log('PLATFORM=linux/arm64')
            } else if ('${{ matrix.target }}'.startsWith('armv7')) {
              console.log('PLATFORM=linux/arm/v7')
            } else {
              console.log('PLATFORM=linux/amd64')
            }
          " >> $GITHUB_OUTPUT
          node -e "
            if ('${{ matrix.target }}'.endsWith('-musl')) {
              console.log('IMAGE=node:${{ matrix.node }}-alpine')
            } else {
              console.log('IMAGE=node:${{ matrix.node }}-slim')
            }
          " >> $GITHUB_OUTPUT
      # Each arch installs on its own runner (aarch64 included), so pnpm
      # fetches the right platform-specific optional deps natively and
      # supportedArchitectures stays unnecessary. That changes only if a lane
      # ever tests an arch it did not install on (armv7 under QEMU would).
      - name: Install dependencies
        run: pnpm install
      # on the host, where pnpm exists: the container runs plain node against
      # the volume-mounted workspace, so the packages' dist/ must already be
      # there
      - name: Build packages
        run: pnpm build:packages
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: ${{ contains(matrix.target, 'armv7') }}
        with:
          platforms: all
      - run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
        if: ${{ contains(matrix.target, 'armv7') }}
      - name: Test bindings
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ steps.docker.outputs.IMAGE }}
          options: '-v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }} --platform ${{ steps.docker.outputs.PLATFORM }}'
          # node:25+ images bundle no package manager (yarn/corepack removed);
          # the suite runs on node's own test runner, so plain node suffices.
          # WRAP_ESM_LAMBDA_ENGINE=oxc is EXPLICIT on purpose: core falls back
          # to the pure-JS engine when the addon cannot be loaded, and an
          # implicit run would turn a broken or missing native artifact into a
          # green acorn run. Naming the engine makes the native lane fail.
          # Second run: the whole suite again on the pure-JS acorn engine, so
          # the JS-only mode stays as covered as the native one.
          run: |
            WRAP_ESM_LAMBDA_ENGINE=oxc OXC_TSCONFIG_PATH=./__test__/tsconfig.json node --import @oxc-node/core/register --test "__test__/*.spec.ts"
            WRAP_ESM_LAMBDA_ENGINE=acorn OXC_TSCONFIG_PATH=./__test__/tsconfig.json node --import @oxc-node/core/register --test "__test__/*.spec.ts"
  test-native-platform:
    name: Test ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    # Windows and macOS, on the runner itself rather than in a container.
    # Neither had ever run the suite, and both exercise code the Linux lanes
    # cannot: the acorn engine reimplements module resolution over
    # node:path (drive letters, backslashes, junction-linked pnpm stores),
    # matching compares '/'-normalized suffixes, and every spec that shells
    # out spawns a real child process. The acorn run matters most here for
    # exactly that reason, so both engines run on both platforms.
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
        node:
          - '22'
          - '24'
          - '26'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # --ignore-scripts: the benchmark chart tooling pulls in `canvas`, which
      # has no prebuild for every Node/platform pair here and would fall back
      # to compiling against GTK/cairo — a dependency of chart generation, not
      # of the suite, failing the install before a single test runs. Nothing
      # the tests need has an install script: the bundler binaries (esbuild,
      # swc, rspack) all arrive as platform-specific optional packages, which
      # is verified by running this whole suite off such an install.
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Build packages
        run: pnpm build:packages
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      # env: rather than an inline assignment — the default shell here is pwsh
      # on Windows, where `VAR=value cmd` is not a thing
      - name: Test bindings (native engine)
        run: node --import @oxc-node/core/register --test "__test__/*.spec.ts"
        env:
          WRAP_ESM_LAMBDA_ENGINE: oxc
          OXC_TSCONFIG_PATH: ./__test__/tsconfig.json
      - name: Test bindings (acorn engine)
        run: node --import @oxc-node/core/register --test "__test__/*.spec.ts"
        env:
          WRAP_ESM_LAMBDA_ENGINE: acorn
          OXC_TSCONFIG_PATH: ./__test__/tsconfig.json
  test-wasi:
    name: Test WASI target - node@${{ matrix.node }}
    needs:
      - build
    # The WASI build is the reach onto every platform with no prebuilt addon,
    # so it carries the same Node matrix as the native lane rather than being
    # spot-checked on one version: its runtime (@napi-rs/wasm-runtime, wasi
    # threads) is exactly the layer Node keeps moving under us.
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22'
          - '24'
          - '26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The wasi runtime (@napi-rs/wasm-runtime) is a regular devDependency,
      # so a plain install suffices — no per-arch config needed.
      - name: Install dependencies
        run: pnpm install
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-wasm32-wasip1-threads
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: pnpm test
        env:
          NAPI_RS_FORCE_WASI: 1
          # explicit, like the native lane: a wasi binding that fails to load
          # must fail this job, not quietly become an acorn run
          WRAP_ESM_LAMBDA_ENGINE: oxc
  test-js-only:
    name: Test JS-only fallback - node@${{ matrix.node }}
    # No artifact download and no Rust: the shape a consumer gets on a
    # platform with no prebuilt addon (and the one npm's optional-dependency
    # bug produces). Core degrades to the acorn engine with a warning instead
    # of throwing out of `--import`, and this proves the degraded mode end to
    # end on every supported major — not just in a unit test.
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22'
          - '24'
          - '26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm build:packages
      - name: Test with no native binding present
        # The excluded specs are the ones that reach for the addon directly
        # (`../index`) or pin WRAP_ESM_LAMBDA_ENGINE=oxc in a child process —
        # both are native-by-construction and covered by test-linux-binding.
        run: |
          SPECS=$(ls __test__/*.spec.ts | grep -vE 'index\.spec|orchestrion-compare|patch\.spec|engine-parity|bundlers|comment-preservation')
          echo "$SPECS"
          OXC_TSCONFIG_PATH=./__test__/tsconfig.json node --import @oxc-node/core/register --test $SPECS
        shell: bash
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Pull requests must never reach this job. Until now it was reached on
    # every PR and only ever skipped because one of its `needs` had failed —
    # so the first fully green PR ran it, and the one thing standing between a
    # pull request and `npm publish` was a commit subject that happens not to
    # start with a version number. `git log -1 --pretty=%s` on a PR reads the
    # branch's own head commit, so "0.2.0 add feature" would have been enough.
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
    needs:
      - lint
      - test-linux-binding
      - test-native-platform
      - test-wasi
      - test-js-only
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: create npm dirs
        run: pnpm exec napi create-npm-dirs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Move artifacts
        run: pnpm run artifacts
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Install hyperfine
        run: sudo apt update && sudo apt install -y hyperfine
      - name: Benchmark
        run: |
          cd hooks && ./bench_hooks.sh && cd ..
          cat hooks/benchTable.md
      - name: Publish
        # Release detection looks at the commit SUBJECT only (%s). Grepping the
        # full body (%B) once matched an incidental line starting with a
        # version-like string and triggered an unintended publish attempt.
        run: |
          npm config set provenance true
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          if echo "$COMMIT_SUBJECT" | grep -q "^[0-9]\+\.[0-9]\+\.[0-9]\+$";
          then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            npm publish --access public
          elif echo "$COMMIT_SUBJECT" | grep -q "^[0-9]\+\.[0-9]\+\.[0-9]\+";
          then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            npm publish --tag next --access public
          else
            echo "Not a release, skipping publish"
          fi
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body_path: hooks/benchTable.md
          files: |
            ${{ env.APP_NAME }}.*.node
            ${{ env.APP_NAME }}.*.wasm
            hooks/benchChart.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
