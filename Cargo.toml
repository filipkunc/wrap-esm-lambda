
[package]
authors = ["Filip Kunc <kunc.filip@gmail.com>"]
edition = "2024"
name    = "wrap_esm_lambda"
# The oxc crates require it, and without it the failure is a confusing
# dependency-level error rather than "upgrade your toolchain". CI floats on
# stable; this is the floor a contributor's stable has to clear.
rust-version = "1.95"
version      = "0.2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi          = "3.2.4"
napi-derive   = "3.2.4"
oxc_allocator = "0.141.0"
oxc_ast       = "0.141.0"
oxc_codegen   = "0.141.0"
oxc_parser    = "0.141.0"
oxc_resolver  = "11.24.2"

oxc_sourcemap = "8.1.2"
oxc_span      = "0.141.0"
oxc_str       = "0.141.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto   = true
strip = "symbols"
