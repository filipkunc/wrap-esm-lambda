
[package]
authors = ["Filip Kunc <kunc.filip@gmail.com>"]
edition = "2024"
name    = "wrap_esm_lambda"
# The oxc crates require it, and without it the failure is a confusing
# dependency-level error rather than "upgrade your toolchain". CI floats on
# stable; this is the floor a contributor's stable has to clear — and
# rust-toolchain.toml (kept in step with this value) makes rustup-managed
# machines install the floor automatically instead of erroring.
rust-version = "1.95"
version      = "0.3.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# object_indexmap: the tap's `privates` field crosses napi as an IndexMap so
# the bridge emission follows the JS object's insertion order
indexmap      = "2"
napi          = { version = "3.2.4", features = ["object_indexmap"] }
napi-derive   = "3.2.4"
oxc_allocator = "0.141.0"
oxc_ast       = "0.141.0"
oxc_ast_visit = "0.141.0"
oxc_codegen   = "0.141.0"
oxc_parser    = "0.141.0"
oxc_resolver  = "11.24.2"

oxc_sourcemap = "8.1.2"
oxc_span      = "0.141.0"
oxc_str       = "0.141.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto   = true
strip = "symbols"
